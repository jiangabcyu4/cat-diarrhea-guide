<html><head><meta charset=utf-8><style>body{margin:0;background:#fff;font-family:PingFang SC,Microsoft YaHei,sans-serif}svg{display:block;margin:0 auto}</style></head><body><svg viewBox="0 0 900 360" role="img" aria-label="喂食决策树">
    <defs><marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#52606d"/></marker></defs>
    <g font-family="inherit" font-size="13" fill="#1f2933">
      <rect x="320" y="8" width="260" height="36" rx="8" fill="#0e7c86"/><text x="450" y="31" text-anchor="middle" fill="#fff">当前在拉稀/软便？</text>
      <line x1="450" y1="44" x2="450" y2="70" stroke="#52606d" marker-end="url(#ar2)"/>
      <polygon points="320,102 450,70 580,102 450,134" fill="#eef4f5" stroke="#0e7c86"/><text x="450" y="98" text-anchor="middle" font-size="12.5">是（活动期）</text><text x="450" y="115" text-anchor="middle" font-size="12.5">还是已稳？</text>
      <line x1="320" y1="102" x2="200" y2="150" stroke="#52606d" marker-end="url(#ar2)"/><text x="250" y="100" font-size="11" fill="#c0392b">活动</text>
      <line x1="580" y1="102" x2="700" y2="150" stroke="#52606d" marker-end="url(#ar2)"/><text x="650" y="100" font-size="11" fill="#2e8b57">已稳</text>
      <rect x="20" y="150" width="340" height="120" rx="8" fill="#fdecea" stroke="#c0392b"/>
      <text x="190" y="174" text-anchor="middle"><b>活动期（拉稀中）</b></text>
      <text x="36" y="198" font-size="12.5">→ 定时 4 餐，每餐 13–18g</text>
      <text x="36" y="218" font-size="12.5">→ 不加新零食；＋南瓜 binder</text>
      <text x="36" y="238" font-size="12.5">→ 按便便分级调量（见右表）</text>
      <text x="36" y="258" font-size="12.5">→ ≥5级超2天 / 警示 → 就医</text>
      <rect x="560" y="150" width="340" height="120" rx="8" fill="#eafaf0" stroke="#2e8b57"/>
      <text x="730" y="174" text-anchor="middle"><b>已稳（2–3级≥1周）</b></text>
      <text x="576" y="198" font-size="12.5">→ 维持定时，可微增 5–10%</text>
      <text x="576" y="218" font-size="12.5">→ 想转自由采食？先观察</text>
      <text x="576" y="238" font-size="12.5">  2 周无反复且猫不暴食</text>
      <text x="576" y="258" font-size="12.5">→ 才可考虑；否则继续定时</text>
      <rect x="20" y="290" width="880" height="58" rx="8" fill="#f3f6f7" stroke="#b9c6c9"/>
      <text x="36" y="312" font-size="12.5"><b>如何判断"量是否合适"：</b>便便 2–3 级且精神好＝量 OK；4 级（偏软）＝维持不增＋南瓜；5–7 级＝减 10–15% 或回上一稳定量；体重下降＝就医。</text>
      <text x="36" y="334" font-size="12.5">自由采食仅适合"天生自控、长期便便正常"的猫；多多当前不符合，强行自由＝复发风险高。</text>
    </g>
  </svg></body></html>
